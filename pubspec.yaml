name: insta_in
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^8.1.0
  lucide_icons: ^0.257.0
  firebase_core: ^4.9.0
  firebase_auth: ^6.5.1
  cloud_firestore: ^6.4.1
  google_sign_in: ^6.2.1
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  package_info_plus: ^10.1.0
  share_plus: ^13.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon.jpeg"

flutter:
  uses-material-design: true

  assets:
    - assets/upi1.jpeg
    - assets/upi2.jpeg
    - assets/google_logo.png
